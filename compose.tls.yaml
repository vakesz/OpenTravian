# Optional HTTPS layer: Caddy gets and renews a certificate for TRAVIAN_DOMAIN,
# redirects HTTP to HTTPS and proxies to nginx. Enable it in .env:
#   COMPOSE_FILE=compose.yaml:compose.tls.yaml
#   TRAVIAN_DOMAIN=game.example.com
# Local test with Caddy's own CA: TRAVIAN_DOMAIN=travian.localhost TRAVIAN_TLS_INTERNAL=1
# `web` keeps its loopback-only port (APP_BIND_ADDRESS); only Caddy listens publicly.
x-domain: &domain ${TRAVIAN_DOMAIN:?Set TRAVIAN_DOMAIN in .env to the public domain name}

services:
  caddy:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${TRAVIAN_CADDY_MEM_LIMIT:-128m}
    pids_limit: ${TRAVIAN_PIDS_LIMIT:-512}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TRAVIAN_DOMAIN: *domain
      TRAVIAN_CADDY_TLS: ${TRAVIAN_TLS_INTERNAL:+tls internal}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account: keep these, or Caddy re-requests them.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      frontend:
        ipv4_address: ${TRAVIAN_CADDY_IP:-172.29.88.10}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # The public address is the domain over HTTPS, and only Caddy's address may set
  # X-Forwarded-For. Explicit TRAVIAN_BASE_URL / TRAVIAN_TRUSTED_PROXY still win.
  web:
    environment:
      TRAVIAN_BASE_URL: ${TRAVIAN_BASE_URL:-https://${TRAVIAN_DOMAIN}/}
      TRAVIAN_TRUSTED_PROXY: ${TRAVIAN_TRUSTED_PROXY:-${TRAVIAN_CADDY_IP:-172.29.88.10}}

  php:
    environment:
      TRAVIAN_BASE_URL: ${TRAVIAN_BASE_URL:-https://${TRAVIAN_DOMAIN}/}
      TRAVIAN_CORS_ORIGIN: ${TRAVIAN_CORS_ORIGIN:-https://${TRAVIAN_DOMAIN}}

  installer:
    environment:
      TRAVIAN_BASE_URL: ${TRAVIAN_BASE_URL:-https://${TRAVIAN_DOMAIN}/}

networks:
  # A fixed subnet gives Caddy a stable address for TRAVIAN_TRUSTED_PROXY.
  frontend:
    ipam:
      config:
        - subnet: ${TRAVIAN_SUBNET:-172.29.88.0/24}

volumes:
  caddy_data:
  caddy_config:
