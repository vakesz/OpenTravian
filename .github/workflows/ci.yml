name: CI

on:
  # Branches are checked through their pull request. A push run for the same
  # commit would be cancelled by the group below and show as a failed check.
  push:
    branches: [main]
  pull_request:

# A newer commit on the same branch cancels the run for the older one.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Offline: relative links and #fragments between the docs. External sites are
      # not fetched, so the check is deterministic.
      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress README.md docs/*.md tools/README.md tests/README.md database/README.md
          fail: true

  # The production images are built here, beside the tests, instead of by
  # dev/check.sh --build. Nothing is pushed or loaded: the build is the check.
  production-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Compose needs the required variables to read the files; the values are not used.
      - name: Write .env
        run: sh config/bootstrap-env.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The runtime stage is shared with the dev image, so its cache is read too.
      - name: Build the production images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: compose.yaml,compose.build.yaml
          set: |
            *.cache-from=type=gha,scope=prod
            *.cache-from=type=gha,scope=dev-php
            *.cache-to=type=gha,mode=max,scope=prod

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No repository secrets. bootstrap-env.sh generates every required value for
      # this run, including REDIS_PASSWORD, and selects the dev Compose layer.
      - name: Write .env
        run: sh config/bootstrap-env.sh --dev

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The dev image (php target `runtime`) copies no source, so its layers stay valid
      # across commits and come from the Actions cache. `load` puts it into the local
      # Docker daemon as opentravian-app:dev, which compose then uses without building.
      # bake-action, not a run step: only the action gets the cache service's credentials.
      - name: Build the dev image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: compose.yaml,compose.dev.yaml
          targets: php
          load: true
          set: |
            *.cache-from=type=gha,scope=dev-php
            *.cache-to=type=gha,mode=max,scope=dev-php

      - name: Start the dev stack
        run: docker compose up -d --wait

      - name: Install the world headlessly
        run: dev/install-world.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dev/client-tests/package-lock.json

      - name: Install Playwright
        working-directory: dev/client-tests
        run: npm ci

      - name: Install Chromium
        working-directory: dev/client-tests
        run: npx playwright install --with-deps chromium

      # The cache only ever holds a PHAR that fetch.sh verified; fetch.sh
      # re-checks the pinned SHA-256 and, on a miss, the GPG signature too.
      - name: Cache the PHPStan PHAR
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dev/phpstan/phpstan.phar
          key: phpstan-${{ hashFiles('dev/phpstan/VERSION', 'dev/phpstan/phpstan.phar.sha256') }}

      - name: Fetch PHPStan
        run: dev/phpstan/fetch.sh

      - name: Run dev/check.sh
        run: dev/check.sh

      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt 2>&1 || true

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7
