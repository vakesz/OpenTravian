name: Release

# Pushing a tag vX.Y.Z publishes multi-arch (linux/amd64 and linux/arm64) images to
# GHCR: ghcr.io/<owner>/opentravian-app and ghcr.io/<owner>/opentravian-web, tagged X.Y.Z,
# X.Y and latest. Each architecture is built on a native runner (no QEMU) and the
# per-architecture images are merged into one manifest list.
#
# The packages are created private on first publish and a workflow cannot change
# that: make them public once (docs/deploy.md, "Maintainers: make the packages public").

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Never cancel a release half way.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every compose layer is valid
        env:
          MARIADB_ROOT_PASSWORD: ci
          REDIS_PASSWORD: ci
          TRAVIAN_SETUP_TOKEN: ci
          TRAVIAN_DOMAIN: game.example.test
        run: |
          for layers in compose.yaml compose.yaml:compose.dev.yaml compose.yaml:compose.build.yaml compose.yaml:compose.tls.yaml; do
            COMPOSE_FILE="$layers" docker compose config --quiet
          done

  build:
    needs: verify
    # Writes the per-architecture image to the registry by digest.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [app, web]
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
          - image: app
            dockerfile: docker/php/Dockerfile
            target: production
          - image: web
            dockerfile: docker/nginx/Dockerfile
            target: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/opentravian-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TRAVIAN_VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    # Tags the merged manifest list in the registry.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [app, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Image name
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/opentravian-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create the multi-arch manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect the result
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
