# Redis configuration. No host port is published and only the backend network
# reaches the service. PHP and the game engine connect over that network, so
# Redis must accept non-loopback container peers; authentication is what protects it.
bind 0.0.0.0
protected-mode no
# The default user's password hash and command rules, written at start by entrypoint.sh.
aclfile /tmp/redis-users.acl
# Cache only: a restart loses nothing the game must keep. Snapshots are off so
# a background save cannot fork the process into the container memory limit.
# 200mb stays under the default 256m cgroup. volatile-lru drops keys that
# already expire (cache, sessions, the heartbeat) and leaves the pause flag,
# which has no TTL. Lower TRAVIAN_REDIS_MEM_LIMIT only together with maxmemory.
save ""
appendonly no
maxmemory 200mb
maxmemory-policy volatile-lru
stop-writes-on-bgsave-error no
