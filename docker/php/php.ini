; No X-Powered-By: PHP/x.y.z header.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
; One game request. Eight workers at this cap fit the default 2g PHP container
; with room for the one long-running admin/setup worker (see www.conf).
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
; Nothing uploads files; forms and JSON bodies are small (nginx caps them at 1m).
file_uploads = Off
post_max_size = 2M
date.timezone = UTC
opcache.enable = 1
; Production files are copied into the image and change only when the container
; is replaced. The dev layer turns checks back on (TRAVIAN_DEV_TOOLS, entrypoint).
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax
session.use_only_cookies = 1
; Sessions live in Redis (the phpredis extension) for the same 30 days; a first
; request without a session cookie gets one day (game/include/bootstrap.php). The
; entrypoint adds the password to the save path at start; it is not stored here.
; Locking keeps a player's parallel requests ordered, which game actions rely on.
session.save_handler = redis
session.save_path = "tcp://redis:6379?persistent=1&timeout=1&read_timeout=2&prefix=travian_session:"
session.gc_maxlifetime = 2592000
session.cookie_lifetime = 2592000
redis.session.locking_enabled = 1
redis.session.lock_expire = 3600
redis.session.lock_retries = 300
redis.session.lock_wait_time = 200000
