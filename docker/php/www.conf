[www]
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
; nginx already closes a game request at 60s. This frees the worker then too,
; instead of leaving it busy until max_execution_time.
request_terminate_timeout = 60
php_admin_value[memory_limit] = 256M
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; admin.php and setup.php. One process, so a map seed or a backup cannot pin
; every game worker, and 1536M still fits the default 2g PHP container.
[long]
user = www-data
group = www-data
listen = 9001
pm = ondemand
pm.max_children = 1
pm.process_idle_timeout = 10s
pm.max_requests = 50
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 3600
php_admin_value[memory_limit] = 1536M
php_admin_value[max_execution_time] = 3600
