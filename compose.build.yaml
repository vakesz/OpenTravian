# Builds the images from this checkout instead of pulling the published ones.
#   COMPOSE_FILE=compose.yaml:compose.build.yaml docker compose build
# The image names stay those of compose.yaml, so a local build is used by `up`.
services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
        TRAVIAN_VERSION: ${TRAVIAN_VERSION:-}

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
